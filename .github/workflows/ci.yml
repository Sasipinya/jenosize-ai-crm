# CI: lint, typecheck, tests and the mock AI eval. No secrets: the mock LLM/LINE adapters are the defaults
# and the tests use in-memory pglite.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0   # same as the local pnpm; the lockfile is v9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval

  # Secret scan over the full git history with the gitleaks CLI (MIT, no license key, no secret needed).
  # .gitleaksignore lists the one known, rotated finding; anything else fails the job.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: $(go env GOPATH)/bin/gitleaks detect --source . --no-banner --redact --verbose
